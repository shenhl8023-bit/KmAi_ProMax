[LLM]
provider = openai
api_key =
base_url = https://api.openai.com/v1
model = gpt-4o
max_tokens = 4096
temperature = 0.3

[KMRAG]
enabled = false
base_url =
api_key =
bearer_token =
timeout = 60

[Paths]
group_template_dir = Resources/GroupTemplate
feature_template_file = Resources/FeatureTemplate/FeatureTemplate.xml
autoidentify_with_direction_dir = Resources/AutoIdentifyWithDirection
[SimilarParts]
# 数据和预置索引路径相对本 config.ini 解析；运行时索引相对 KMAI_RUNTIME_DIR 解析。
enabled = true
matching_backend = feature_vector
# 填写当前环境允许访问的 XML 特征服务地址，支持 HTTP/HTTPS。
feature_api_base_url =
feature_api_timeout_seconds = 120
# 人工部署版本标签；更换模型权重后必须更新并重启，首次使用时会自动补建索引。
feature_model_version =
feature_index_file = cache/similar_parts_features.sqlite3
# 可选的预置索引；首次运行时复制到用户运行目录，不覆盖已有运行时索引。
feature_index_seed_file = Resources/SimilarParts/similar_parts_features.sqlite3
step_viewer_root = step-compare
xml_library_dir = PartClassification-main/PartClassification-main/source/XML样本
step_library_dir = PartClassification-main/PartClassification-main/source/STEP样本
# 3DMPS 固定导出路径；服务始终从这两个文件读取当前零件。
current_part_dir =
current_xml_file = C:/tmp/3dmps-data/AIBasicInfo.xml
current_step_file = C:/tmp/3dmps-data/stepModel.stp
# Win7 SP1 包默认在目标机实时转换 STEP；只有显式打开 Lite 才读取 GLB 缓存。
# 普通 Win10/11 环境保持 false，继续使用 step_viewer 实时转换。
win7_lite_mode = false
prebuilt_model_dir =
# 相似零件展示数量，允许 1-1000；不足时返回实际数量，无效值回退为 5。
top_k = 5
template_map_file = Resources/SimilarParts/模板/模板映射.json
upload_max_bytes = 5242880
cache_ttl_seconds = 1800
model_cache_entries = 8
model_cache_bytes = 268435456
