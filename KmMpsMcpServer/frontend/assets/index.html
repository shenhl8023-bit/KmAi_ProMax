<!doctype html>

<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>AI小沐 Agent</title>
  <style>{{style}}</style>
</head>
<body>
  <header>
    <span>AI小沐</span>
    <div class="header-actions">
      <select id="agentSelect" title="选择智能体">
        <option value="default">默认助手</option>
      </select>
      <button id="debugToggleBtn" type="button" class="debug-toggle" title="显示调试信息" aria-pressed="false">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l1.88 1.88M14.12 3.88L16 2M9 7.13v-1a3 3 0 1 1 6 0v1M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6M12 20v-9M6.53 9C4.6 8.8 3 7.1 3 5M20.97 5c0 2.1-1.6 3.8-3.5 4M12 20H8M12 20h4"/></svg>
        <span class="debug-toggle-text">调试</span>
      </button>
      <span class="status" id="status"><span class="dot warn"></span>检查连接中...</span>
      <button id="configBtn" type="button">&#27169;&#22411;&#37197;&#32622;</button>
      <button id="testBtn" type="button">测试连接</button>
    </div>
  </header>
  <main>
    <section id="workflowDock" class="process-workflow-dock"></section>
    <div id="processRoutePanelBackdrop" class="process-route-panel-backdrop" style="display:none"></div>
    <section id="processRoutePanel" class="process-route-panel" style="display:none">
      <div class="pr-shell">
        <div class="pr-head">
          <div class="pr-head-title">
            <span class="pr-head-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </span>
            <span>&#24037;&#33402;&#36335;&#32447;&#29983;&#25104;</span>
          </div>
          <div class="pr-head-status">
            <span class="pr-head-dot"></span>
            <span id="prHeadStatusText">&#31561;&#24453; CAD &#36755;&#20837;</span>
          </div>
          <div class="pr-head-actions">
            <span class="pr-head-info" id="prMetaInfo" style="display:none"></span>
            <button id="prMoreBtn" type="button" title="&#35814;&#24773;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
            <button id="prCloseBtn" class="pr-drawer-close" type="button" title="&#20851;&#38381;">&times;</button>
          </div>
        </div>
        <div class="pr-body">
          <div class="pr-summary" id="prSummary" style="display:none">
            <div class="pr-summary-main">
              <div class="pr-summary-copy">
                <div class="pr-summary-title">&#24037;&#33402;&#36335;&#32447;</div>
                <div class="pr-summary-stats">
                  <span class="pr-summary-stat"><strong id="prStatGroup">0</strong>&#20998;&#32452;</span>
                  <span class="pr-summary-stat"><strong id="prStatFeature">0</strong>&#29305;&#24449;</span>
                  <span class="pr-summary-stat"><strong id="prStatProcess">0</strong>&#24037;&#24207;</span>
                  <span class="pr-summary-stat"><strong id="prStatStep">0</strong>&#24037;&#27493;</span>
                </div>
              </div>
              <span class="pr-summary-badge" id="prSummaryOk">&#24403;&#21069;&#23637;&#31034;&#24037;&#33402;&#36335;&#32447;</span>
            </div>
          </div>
          <div class="pr-params" id="prParamsBlock">
            <div class="pr-panel-card pr-input-card">
              <div class="pr-panel-card-head">
                <div class="pr-panel-card-title">&#36755;&#20837;&#21442;&#25968;</div>
              </div>
              <div class="pr-params-row">
                <span class="pr-chip"><span class="pr-chip-k">&#26448;&#26009;</span><span class="pr-chip-v" id="prChipMaterial">&#8212;</span></span>
                <span class="pr-chip"><span class="pr-chip-k">&#31867;&#22411;</span><span class="pr-chip-v" id="prChipPartType">&#8212;</span></span>
                <span class="pr-chip"><span class="pr-chip-k">&#28909;&#22788;&#29702;</span><span class="pr-chip-v" id="prChipHeat">&#8212;</span></span>
                <span class="pr-chip"><span class="pr-chip-k">&#36873;&#39033;</span><span class="pr-chip-v" id="prChipSurface">&#8212;</span></span>
              </div>
              <div class="pr-params-detail" id="prParamsDetail">
                <div class="pr-group">
                  <div class="pr-group-title">&#22522;&#26412;&#20449;&#24687; <span class="pr-group-required">&#24517;&#22635;</span></div>
                  <div class="pr-fields">
                    <div class="pr-field">
                      <label for="processRouteMaterialGrade">&#26448;&#26009;&#29260;&#21495; <span class="pr-required">*</span></label>
                      <select id="processRouteMaterialGrade">
                        <option value="">&#35831;&#36873;&#25321;</option>
                        <option value="9Cr18">9Cr18</option>
                        <option value="4Cr14Ni14W2Mo">4Cr14Ni14W2Mo</option>
                        <option value="6061">6061</option>
                      </select>
                    </div>
                    <div class="pr-field">
                      <label for="processRoutePartType">&#38646;&#20214;&#31867;&#22411; <span class="pr-required">*</span></label>
                      <select id="processRoutePartType">
                        <option value="">&#35831;&#36873;&#25321;</option>
                        <option value="&#34924;&#22871;">&#34924;&#22871;</option>
                        <option value="&#27963;&#38376;">&#27963;&#38376;</option>
                      </select>
                    </div>
                    <div class="pr-field pr-field-full">
                      <label>&#38468;&#21152;&#36873;&#39033;</label>
                      <div class="pr-check-row">
                        <label class="pr-check"><input id="processRouteFlagShapedHole" type="checkbox"> &#22411;&#23380; / &#21106;&#25153;</label>
                        <label class="pr-check"><input id="processRouteFlagPostStageHole" type="checkbox"> &#21518;&#27573;&#34917;&#20805;&#23380;</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="pr-group">
                  <div class="pr-group-title">&#21518;&#22788;&#29702;&#35201;&#27714;</div>
                  <div class="pr-fields">
                    <div class="pr-field">
                      <label for="processRouteHeatTreatment">&#28909;&#22788;&#29702;</label>
                      <select id="processRouteHeatTreatment">
                        <option value="">&#35831;&#36873;&#25321;</option>
                        <option value="&#28140;&#28779;">&#28140;&#28779;</option>
                        <option value="&#21435;&#24212;&#21147;">&#21435;&#24212;&#21147;</option>
                        <option value="&#30495;&#31354;&#28140;&#28779;">&#30495;&#31354;&#28140;&#28779;</option>
                        <option value="&#28183;&#27694;&#23618;">&#28183;&#27694;&#23618;</option>
                      </select>
                    </div>
                    <div class="pr-field">
                      <label>&#34920;&#38754;&#22788;&#29702;</label>
                      <div class="pr-check-row">
                        <label class="pr-check"><input type="checkbox" value="铬酸阳极化" data-surface><span>铬酸阳极化</span></label>
                        <label class="pr-check"><input type="checkbox" value="硬质阳极化" data-surface><span>硬质阳极化</span></label>
                      </div>
                    </div>
                    <div class="pr-field">
                      <label for="processRouteInspectionItems">&#26816;&#27979;&#39033;</label>
                      <select id="processRouteInspectionItems">
                        <option value="">&#26080;</option>
                        <option value="&#35010;&#32441;&#26816;&#27979;">&#35010;&#32441;&#26816;&#27979;</option>
                        <option value="&#28903;&#20260;&#26816;&#26597;">&#28903;&#20260;&#26816;&#26597;</option>
                        <option value="&#23610;&#23544;&#26816;&#27979;">&#23610;&#23544;&#26816;&#27979;</option>
                        <option value="&#35010;&#32441;&#26816;&#27979;,&#28903;&#20260;&#26816;&#26597;">&#35010;&#32441;&#26816;&#27979; + &#28903;&#20260;&#26816;&#26597;</option>
                      </select>
                    </div>
                    <div class="pr-field">
                      <label for="processRouteMarkingMethods">&#26631;&#35782;&#26041;&#24335;</label>
                      <select id="processRouteMarkingMethods">
                        <option value="">&#26080;</option>
                        <option value="&#26631;&#21360;">&#26631;&#21360;</option>
                        <option value="&#26631;&#21051;">&#26631;&#21051;</option>
                        <option value="&#26631;&#21360;,&#26631;&#21051;">&#26631;&#21360; + &#26631;&#21051;</option>
                      </select>
                    </div>
                  </div>
                </div>
                <button class="pr-regen" id="processRouteGenerateBtn" type="button">&#29983;&#25104;&#24037;&#33402;&#36335;&#32447;</button>
              </div>
            </div>
          </div>
          <div class="pr-status" id="processRouteStatus">&#31561;&#24453; CAD &#36755;&#20837;</div>
          <div class="pr-results-stack">
            <div class="pr-timeline" id="processRouteResults">
              <div class="pr-empty">&#23578;&#26410;&#29983;&#25104;&#24037;&#33402;&#36335;&#32447;&#12290;</div>
            </div>
          </div>
        </div>
        <div class="pr-footer">
          <div class="pr-action-row" id="processRouteTechnicalRow" style="display:none">
            <button id="processRouteTechnicalBtn" class="pr-action-secondary" type="button" disabled>&#29983;&#25104;&#25216;&#26415;&#35201;&#27714;</button>
          </div>
          <div class="pr-action-row" id="processRouteSubmitRow" style="display:none">
            <button id="processRouteSubmitBtn" class="pr-action-tertiary" type="button" disabled>&#25552;&#20132;&#24037;&#33402;&#25968;&#25454;</button>
          </div>
        </div>
      </div>
    </section>
    <div id="similarPartsPanelBackdrop" class="similar-parts-panel-backdrop" style="display:none"></div>
    <section id="similarPartsPanel" class="similar-parts-panel-overlay" style="display:none">
      <div class="similar-parts-panel-host"></div>
    </section>
    <section id="log"></section>
    <section class="bar">
      <div class="composer-box">
        <input id="input" type="text" placeholder="例如：读取当前BOF" autocomplete="off">
        <button id="sendBtn" type="button">&#9654;</button>
      </div>
    </section>
  </main>
  <script type="importmap">
  {
    "imports": {
      "three": "/similar-assets/three/build/three.module.js",
      "three/addons/": "/similar-assets/three/examples/jsm/"
    }
  }
  </script>
  <script>window.__LLM_STATUS__ = {{llm_status_json}};</script>
  <script type="module" src="/assets/modules/entry.js"></script>
</body>
</html>
