name: Windows x64

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        shell: pwsh
        run: |
          py -3.12 -m pip install --require-hashes -r requirements.txt
          py -3.12 -m pip install -r requirements-dev.txt

      - name: Python tests and checks
        shell: pwsh
        run: |
          py -3.12 -m pytest -q
          py -3.12 -m compileall -q step_viewer
          py -3.12 -m pip check

      - name: Node tests and syntax check
        shell: pwsh
        run: |
          node --check web/app.js
          node --test tests/test_view_align.mjs

      - name: Browser E2E
        shell: pwsh
        run: |
          npm ci
          npx playwright install chromium
          npm run test:e2e

      - name: Build offline package
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-offline.ps1

      - name: Validate package hash and clean runtime
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\STEP-Compare-win-x64-*.zip | Select-Object -First 1
          if (-not $zip) { throw "Offline ZIP was not created." }
          $hashFile = "$($zip.FullName).sha256"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLowerInvariant()
          $expected = (Get-Content -Raw -LiteralPath $hashFile).Split(' ')[0].Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "ZIP SHA-256 mismatch." }

          $extract = Join-Path $env:RUNNER_TEMP "step-compare-package"
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract
          $root = Join-Path $extract "STEP-Compare"
          $python = Join-Path $root "runtime\python\python.exe"
          & $python -c "import cascadio, fastapi, trimesh; print('embedded imports ok')"
          if ($LASTEXITCODE -ne 0) { throw "Embedded runtime imports failed." }
          if (-not (Test-Path (Join-Path $root "web\vendor\three\build\three.module.js"))) { throw "Vendored Three.js missing." }

          $process = Start-Process -FilePath $python -ArgumentList @("-m", "step_viewer", "--port", "9010", "--no-browser") -WorkingDirectory $root -PassThru
          try {
            $ready = $false
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            while ([DateTime]::UtcNow -lt $deadline -and -not $process.HasExited) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:9010/api/health" -TimeoutSec 1
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw "Embedded service did not become ready." }
            if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9010/).StatusCode -ne 200) { throw "Home page failed." }
            $metadata = Invoke-RestMethod -Uri "http://127.0.0.1:9010/api/tessellate/v2" -Method Post -Form @{ file = Get-Item (Join-Path $root "S-DEMO-02.stp") }
            if ($metadata.unit -ne "mm" -or $metadata.source_unit -ne "mm") { throw "STEP conversion metadata failed." }
            $model = Invoke-WebRequest -UseBasicParsing ("http://127.0.0.1:9010" + $metadata.glb_url)
            if ($model.StatusCode -ne 200 -or $model.RawContentLength -lt 4) { throw "Binary GLB download failed." }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload offline package
        uses: actions/upload-artifact@v4
        with:
          name: STEP-Compare-win-x64
          path: |
            dist\STEP-Compare-win-x64-*.zip
            dist\STEP-Compare-win-x64-*.zip.sha256
